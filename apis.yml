aid: microsoft-azure-functions
name: Microsoft Azure Functions
description: Azure Functions is a serverless compute platform from Microsoft Azure enabling event-driven code execution triggered
  by HTTP requests, timers, queues, blobs, and other Azure services. The Azure Functions management API provides programmatic
  access to function app lifecycle management, deployment, configuration, scaling, and monitoring through Azure Resource Manager.
