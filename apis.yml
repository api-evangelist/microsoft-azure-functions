- aid: microsoft-azure-functions:azure-functions-management-api
  name: Azure Functions Management API
  description: The Azure App Service / Web Apps REST API provides management operations for Azure Functions apps including
    creating and configuring function apps, managing deployment slots, application settings, host keys, function keys, scaling
    configuration, and monitoring. Part of the Azure Resource Manager API surface.
  humanURL: https://learn.microsoft.com/en-us/rest/api/appservice/web-apps
  baseURL: https://management.azure.com
