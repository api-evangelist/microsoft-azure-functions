naftiko: 1.0.0-alpha2
info:
  label: WebApps API Client
  description: 'WebApps API Client. 20 operations. Lead operation: Gets publishing user. Self-contained Naftiko capability
    covering one Microsoft Azure Functions business surface.'
  tags:
  - Microsoft Azure Functions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_AZURE_FUNCTIONS_API_KEY: MICROSOFT_AZURE_FUNCTIONS_API_KEY
capability:
  consumes:
  - type: http
    namespace: azure-functions-management-general
    baseUri: https://management.azure.com
    description: WebApps API Client business capability. Self-contained, no shared references.
    resources:
    - name: providers-Microsoft.Web-publishingUsers-web
      path: /providers/Microsoft.Web/publishingUsers/web
      operations:
      - name: getpublishinguser
        method: GET
        description: Gets publishing user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatepublishinguser
        method: PUT
        description: Updates publishing user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: userDetails
          in: body
          type: string
          description: Details of publishing user
          required: true
    - name: providers-Microsoft.Web-sourcecontrols
      path: /providers/Microsoft.Web/sourcecontrols
      operations:
      - name: listsourcecontrols
        method: GET
        description: Gets the source controls available for Azure websites.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: providers-Microsoft.Web-sourcecontrols-sourceControlType
      path: /providers/Microsoft.Web/sourcecontrols/{sourceControlType}
      operations:
      - name: getsourcecontrol
        method: GET
        description: Gets source control token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sourceControlType
          in: path
          type: string
          description: Type of source control
          required: true
      - name: updatesourcecontrol
        method: PUT
        description: Updates source control token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sourceControlType
          in: path
          type: string
          description: Type of source control
          required: true
        - name: requestMessage
          in: body
          type: string
          description: Source control token information
          required: true
    - name: subscriptions-subscriptionId-providers-Microsoft.Web-aseRegions
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Web/aseRegions
      operations:
      - name: listaseregions
        method: GET
        description: Get a list of available ASE regions and its supported Skus.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: subscriptions-subscriptionId-providers-Microsoft.Web-billingMeters
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Web/billingMeters
      operations:
      - name: listbillingmeters
        method: GET
        description: Gets a list of meters for a given location.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: billingLocation
          in: query
          type: string
          description: Azure Location of billable resource
        - name: osType
          in: query
          type: string
          description: App Service OS type meters used for
    - name: subscriptions-subscriptionId-providers-Microsoft.Web-checknameavailability
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Web/checknameavailability
      operations:
      - name: checknameavailability
        method: POST
        description: Check if a resource name is available.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: request
          in: body
          type: string
          description: The request body
          required: true
